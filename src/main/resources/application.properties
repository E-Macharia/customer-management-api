spring.application.name=customer-api

# Server Config
server.port=8700

# Datasource Config
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:customerdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Config
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Config
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false

# JWT Config
app.jwt.secret=${JWT_SECRET:9a4f2c8d3b7a1e6f5c8d9a4f2c8d3b7a1e6f5c8d9a4f2c8d3b7a1e6f5c8d9a4f}
app.jwt.expiration-ms=86400000

# OpenAPI / Swagger Config
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Actuator Config
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.info.env.enabled=true
