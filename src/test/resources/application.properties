spring.application.name=customer-api-test

# Use in-memory H2 database for all tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Disable Flyway for tests (Hibernate will create/drop schema automatically)
spring.flyway.enabled=false

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# JWT Config for tests
app.jwt.secret=9a4f2c8d3b7a1e6f5c8d9a4f2c8d3b7a1e6f5c8d9a4f2c8d3b7a1e6f5c8d9a4f
app.jwt.expiration-ms=86400000

# Security Debug Logging
logging.level.org.springframework.security=DEBUG
